# PURE-PRM Configuration for MAMBA-STEP
# Process Reward Model Only (No Verifiable Rewards)
# Uses BlankRewardManager to return zero VR

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

ray_kwargs:
    ray_init:
        num_cpus: 24
data:
  train_files: /project/phan/kt477/MAMBA-STEP/M1/rl/verl/scripts/train.parquet
  val_files: /project/phan/kt477/MAMBA-STEP/M1/rl/verl/scripts/aime.parquet
  max_prompt_length: 1024
  max_response_length: 8192
  train_batch_size: 4 
  val_batch_size: 4

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: JunxiongWang/M1-3B-SFT
    mamba: True
    use_remove_padding: True
    enable_gradient_checkpointing: True
  actor:
    optim:
      lr: 3e-6
    use_dynamic_bsz: True
    ppo_mini_batch_size: 2
    ppo_max_token_len_per_gpu: 9216
    use_kl_loss: False
    kl_loss_coef: 0
    kl_loss_type: low_var_kl
    entropy_coeff: 0.01
    ulysses_sequence_parallel_size: 1
    grad_clip: 1
    fsdp_config:
      param_offload: False 
      optimizer_offload: False
      model_dtype: bfloat16
  rollout:
    name: hf
    tensor_model_parallel_size: 1
    temperature: 0.9
    val_kwargs:
      temperature: 0.6
      n: 8
    gpu_memory_utilization: 0.6
    n: 8
    dtype: bfloat16

# PURE-PRM: Enable Process Reward Model with BlankRewardManager
reward_model:
  enable: True
  type: prm  # Process Reward Model
  strategy: fsdp
  model:
    path: jinachris/PURE-PRM-7B  # Set your PRM model path here
    use_remove_padding: True
    enable_gradient_checkpointing: True
    fsdp_config:
      param_offload: False
      wrap_policy:
        min_num_params: 0
      model_dtype: bfloat16
  reward_manager: blank  # Returns zero VR - PURE-PRM only uses process rewards
  micro_batch_size_per_gpu: null
  use_dynamic_bsz: True
  forward_max_token_len_per_gpu: 9216
  ulysses_sequence_parallel_size: 1
  # PURE credit assignment: float for approximate min-form, 'strict min-form' for exact
  credit_assignment: 'strict min-form'  # Temperature for approximate min-form (softmax weighting)
  modeling_reward_coef: 1.0  # Weight for process rewards
  # Step splitting configuration
  split_step_char: '\n\n'  # Character sequence that separates reasoning steps
  step_separator: '\n'  # Character added after each step for PRM prediction

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  kl_ctrl:
    type: fixed
    kl_coef: 0

trainer:
  critic_warmup: 0
  logger: ['console', 'wandb']
  project_name: 'M1'
  experiment_name: mamba_pure_prm_temp0.1
  val_generations_to_log_to_wandb: 1
  val_before_train: False
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 5
  test_freq: 5
  default_hdfs_dir: null
  default_local_dir: /scratch/phan/kt477/MAMBA-STEP/checkpoints/mamba_pure_prm-new
  total_epochs: 3
